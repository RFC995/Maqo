<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="acento" x1="120" y1="80" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35c7f0"/>
      <stop offset="1" stop-color="#6d8bff"/>
    </linearGradient>
    <linearGradient id="torre" x1="150" y1="200" x2="362" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8eeff"/>
      <stop offset="1" stop-color="#93a6cc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <rect x="4" y="4" width="504" height="504" rx="109" fill="none" stroke="#35c7f0" stroke-opacity="0.18" stroke-width="8"/>

  <!-- coverage rings on the ground -->
  <ellipse cx="256" cy="404" rx="176" ry="52" fill="none" stroke="url(#acento)" stroke-opacity="0.2" stroke-width="7"/>
  <ellipse cx="256" cy="404" rx="122" ry="36" fill="none" stroke="url(#acento)" stroke-opacity="0.34" stroke-width="7"/>
  <ellipse cx="256" cy="404" rx="70" ry="21" fill="none" stroke="url(#acento)" stroke-opacity="0.5" stroke-width="7"/>

  <!-- building -->
  <path d="M168 214h176v182a10 10 0 0 1-10 10H178a10 10 0 0 1-10-10z" fill="url(#torre)"/>
  <path d="M344 214v182a10 10 0 0 1-10 10h-30V214z" fill="#7b8db4"/>

  <!-- windows -->
  <g fill="#0d1526">
    <rect x="192" y="242" width="30" height="30" rx="4"/>
    <rect x="238" y="242" width="30" height="30" rx="4"/>
    <rect x="192" y="292" width="30" height="30" rx="4"/>
    <rect x="238" y="292" width="30" height="30" rx="4"/>
    <rect x="192" y="342" width="30" height="30" rx="4"/>
    <rect x="238" y="342" width="30" height="30" rx="4"/>
  </g>
  <g fill="#35c7f0" opacity="0.92">
    <rect x="284" y="242" width="30" height="30" rx="4"/>
    <rect x="284" y="292" width="30" height="30" rx="4"/>
    <rect x="284" y="342" width="30" height="30" rx="4"/>
  </g>

  <!-- gateway mast + signal -->
  <rect x="248" y="132" width="16" height="84" rx="8" fill="url(#acento)"/>
  <circle cx="256" cy="124" r="19" fill="url(#acento)"/>
  <path d="M198 148a76 76 0 0 1 26-57" stroke="url(#acento)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M314 148a76 76 0 0 0-26-57" stroke="url(#acento)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M156 166a124 124 0 0 1 40-92" stroke="url(#acento)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.42"/>
  <path d="M356 166a124 124 0 0 0-40-92" stroke="url(#acento)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.42"/>
